# One command brings up n8n (with PostgreSQL), the Python engine and a local mail catcher.
#
#   cp .env.example .env     # add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID at least
#   docker compose up -d
#   open http://localhost:5678  (n8n)  and  http://localhost:8025  (Mailpit, every email the owner approves)
#
# The three workflows and the two credentials are imported on first start by the `n8n-import` job.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 3s
      retries: 20

  engine:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/leadintake.sqlite
    volumes:
      - ./data:/app/data
      - ./criteria.yaml:/app/criteria.yaml:ro
    ports:
      - "8000:8000"

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  n8n-import:
    image: n8nio/n8n:${N8N_VERSION:-2.43.8}
    env_file:
      - path: .env
        required: false
    environment: &n8n-env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-to-a-long-random-string}
      GENERIC_TIMEZONE: Europe/London
      TZ: Europe/London
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # read by the workflows through $env
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      LEAD_ENGINE_TOKEN: ${API_TOKEN:-}
      REPLY_FROM: ${REPLY_FROM:-hello@hollisandgrey.example}
    volumes:
      - ./workflows:/workflows:ro
      - ./n8n:/n8n:ro
    entrypoint: ["/bin/sh", "/n8n/import.sh"]
    depends_on:
      db:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.43.8}
    env_file:
      - path: .env
        required: false
    environment:
      <<: *n8n-env
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: "false"
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully
      engine:
        condition: service_started

  # Optional: a public HTTPS URL for Telegram's button taps on a laptop, no install needed.
  #   docker compose --profile tunnel up -d tunnel
  #   docker compose logs tunnel | grep trycloudflare      -> put that URL into WEBHOOK_URL in .env
  #   docker compose up -d n8n                             -> n8n re-registers the Telegram webhook
  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      n8n:
        condition: service_started

volumes:
  pgdata:
  n8ndata:
